services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: edge
      POSTGRES_USER: edge
      POSTGRES_PASSWORD: edge
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edge -d edge"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

